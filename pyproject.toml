[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fii-surrogate-methodology"
version = "2.0.0"
description = "Post hoc evaluation of functional behaviour in machine-learning surrogate models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Mateusz Żeruń"}
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
fii-surrogate-run = "fii_surrogate.cli:main"

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.21414810"
"Related publication" = "https://doi.org/10.1038/s41598-026-65202-3"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
